# GitHub Actions workflow for CI/CD
# - test
# - security (SAST, secret detection, dependency scanning)
# - build
# - publish

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-
      - name: Read pinned Node.js version
        id: node
        run: echo "version=$(sed -nE 's:.*<vaadin.node.version>(v[0-9.]+)</vaadin.node.version>.*:\1:p' pom.xml)" >> "$GITHUB_OUTPUT"
      - name: Cache Vaadin's Node.js
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.vaadin/node-${{ steps.node.outputs.version }}
          key: ${{ runner.os }}-vaadin-node-${{ steps.node.outputs.version }}
      - name: Run tests
        run: ./mvnw verify -DskipITs=false

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "25"
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # Only required for Organizations,
      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-
      - name: Read pinned Node.js version
        id: node
        run: echo "version=$(sed -nE 's:.*<vaadin.node.version>(v[0-9.]+)</vaadin.node.version>.*:\1:p' pom.xml)" >> "$GITHUB_OUTPUT"
      - name: Cache Vaadin's Node.js
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.vaadin/node-${{ steps.node.outputs.version }}
          key: ${{ runner.os }}-vaadin-node-${{ steps.node.outputs.version }}
      - name: SAST (CodeQL)
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: java, javascript
      - name: Compile project
        run: ./mvnw clean install package -DskipTests
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      - name: Run OWASP Dependency-Check
        if: env.NVD_API_KEY != ''
        run: ./mvnw org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7
      - name: Upload Dependency-Check results
        if: env.NVD_API_KEY != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html

  build:
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-
      - name: Read pinned Node.js version
        id: node
        run: echo "version=$(sed -nE 's:.*<vaadin.node.version>(v[0-9.]+)</vaadin.node.version>.*:\1:p' pom.xml)" >> "$GITHUB_OUTPUT"
      - name: Cache Vaadin's Node.js
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.vaadin/node-${{ steps.node.outputs.version }}
          key: ${{ runner.os }}-vaadin-node-${{ steps.node.outputs.version }}
      - name: Build with Maven
        run: ./mvnw clean install package -DskipTests -Pproduction
      - name: Verify pinned frontend dependencies
        run: python3 scripts/check_frontend_deps.py

