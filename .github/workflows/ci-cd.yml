# GitHub Actions workflow for CI/CD
# - test
# - security (SAST, dependency scanning; secret detection runs in test, as make lint-repo)
# - build
# - publish

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # lint-secrets scans the full history; a shallow clone fails it
      # devkit's Markdown gate needs node on PATH; Vaadin's own Node.js under ~/.vaadin is not on it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22" # the newest 22.x, at or above devkit's 22.22.2 floor
          check-latest: true # not an older 22.x the runner has cached
      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-
      - name: Read pinned Node.js version
        id: node
        run: echo "version=$(sed -nE 's:.*<vaadin.node.version>(v[0-9.]+)</vaadin.node.version>.*:\1:p' pom.xml)" >> "$GITHUB_OUTPUT"
      - name: Cache Vaadin's Node.js
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.vaadin/node-${{ steps.node.outputs.version }}
          key: ${{ runner.os }}-vaadin-node-${{ steps.node.outputs.version }}
      # devkit.toml's url is on a private network; devkitw falls back to its GitHub mirror.
      - name: Repository gates (pins, decisions, secrets, Markdown)
        run: make lint-repo
      - name: Test frontend lifecycle scripts
        run: make test-scripts
      - name: Run tests
        run: ./mvnw verify -DskipITs=false

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-
      - name: Read pinned Node.js version
        id: node
        run: echo "version=$(sed -nE 's:.*<vaadin.node.version>(v[0-9.]+)</vaadin.node.version>.*:\1:p' pom.xml)" >> "$GITHUB_OUTPUT"
      - name: Cache Vaadin's Node.js
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.vaadin/node-${{ steps.node.outputs.version }}
          key: ${{ runner.os }}-vaadin-node-${{ steps.node.outputs.version }}
      - name: SAST (CodeQL)
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: java, javascript
      - name: Compile project
        run: make install
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      - name: Run OWASP Dependency-Check
        if: env.NVD_API_KEY != ''
        run: make audit
      - name: Upload Dependency-Check results
        if: ${{ !cancelled() && env.NVD_API_KEY != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html

  build:
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-
      - name: Read pinned Node.js version
        id: node
        run: echo "version=$(sed -nE 's:.*<vaadin.node.version>(v[0-9.]+)</vaadin.node.version>.*:\1:p' pom.xml)" >> "$GITHUB_OUTPUT"
      - name: Cache Vaadin's Node.js
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.vaadin/node-${{ steps.node.outputs.version }}
          key: ${{ runner.os }}-vaadin-node-${{ steps.node.outputs.version }}
      # make install builds without tests, then checks the pinned frontend dependencies;
      # MAVEN_ARGS adds the production frontend build to its Maven call. Only mvn's launcher
      # script reads MAVEN_ARGS (./mvnw ignores it), and devkit runs mvn when it is on PATH,
      # so the step refuses a runner without one rather than build without the profile.
      - name: Build with Maven
        run: |
          command -v mvn > /dev/null || { echo "::error::mvn is not on PATH; MAVEN_ARGS would be ignored"; exit 1; }
          make install
        env:
          MAVEN_ARGS: -Pproduction

  # GitHub's automatic dependency submission runs Maven on a bare checkout, where devkit's parent
  # POM does not resolve (Maven reads it only through the .devkit link), so it is off in the
  # repository settings and the dependency graph is submitted here, once the link exists.
  dependency-submission:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-
      - name: Link devkit
        run: ./devkitw path
      - uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6.0.1

