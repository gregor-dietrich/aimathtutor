# GitHub Actions workflow for CI/CD
# - test
# - security (SAST, secret detection, dependency scanning)
# - build
# - publish

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Run tests
        run: ./mvnw verify

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "25"
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # Only required for Organizations,
      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-
      - name: SAST (CodeQL)
        uses: github/codeql-action/init@v4
        with:
          languages: java, javascript
      - name: Compile project
        run: ./mvnw clean install package -DskipTests
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
      - name: Run OWASP Dependency-Check
        if: env.NVD_API_KEY != ''
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7
      - name: Upload Dependency-Check results
        if: env.NVD_API_KEY != ''
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html

  build:
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-
      - name: Build with Maven
        run: ./mvnw clean install package -DskipTests -Pproduction
      - name: Run SpotBugs
        run: ./mvnw spotbugs:check
      - name: Run Checkstyle
        run: ./mvnw checkstyle:check
      - name: Run PMD
        run: ./mvnw pmd:check
      - name: Run CPD
        run: ./mvnw pmd:cpd-check

