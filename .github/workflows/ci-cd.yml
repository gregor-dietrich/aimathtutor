# GitHub Actions workflow for CI/CD
# - test
# - security (SAST, dependency scanning; secret detection runs in test, as make lint-repo)
# - build
# - dependency-submission (push only)
# - publish

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # No later step pushes, so the token stays away from the build code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # lint-secrets scans the full history; a shallow clone fails it
      - name: Validate development and production Compose configurations
        run: |
          cp .env.example .env
          cp .env.example deploy/.env
          docker compose -f docker-compose.yml config --quiet
          docker compose -f deploy/compose.yml config --quiet
      # devkit's Markdown gate needs node on PATH; Vaadin's own Node.js under ~/.vaadin is not on it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22" # the newest 22.x, at or above devkit's 22.22.2 floor
          check-latest: true # not an older 22.x the runner has cached
      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-
      - name: Read pinned Node.js version
        id: node
        run: echo "version=$(sed -nE 's:.*<vaadin.node.version>(v[0-9.]+)</vaadin.node.version>.*:\1:p' pom.xml)" >> "$GITHUB_OUTPUT"
      - name: Cache Vaadin's Node.js
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.vaadin/node-${{ steps.node.outputs.version }}
          key: ${{ runner.os }}-vaadin-node-${{ steps.node.outputs.version }}
      # devkit.toml's url is on a private network; devkitw falls back to its GitHub mirror.
      # -k runs every repository gate and reports each failure; the tests still run after a failed
      # gate (the job stays red), so one push shows every problem.
      - name: Repository gates (devkitw, pins, decisions, secrets, Markdown)
        run: make -k lint-repo
      - name: Test frontend lifecycle scripts
        if: ${{ !cancelled() }}
        run: make test-scripts
      # -o skips make test's test-scripts prerequisite, which the step above ran, so a failing
      # script test does not stop the Java tests.
      - name: Run tests
        if: ${{ !cancelled() }}
        run: make -o test-scripts test
        env:
          MAVEN_ARGS: -DskipITs=false
      # make test runs Maven quietly, and skipped ITs also skip the coverage check, so a green
      # step alone does not show that the ITs ran.
      - name: Check that the integration tests ran
        run: |
          shopt -s nullglob
          reports=(target/failsafe-reports/TEST-*.xml)
          echo "${#reports[@]} integration test classes reported"
          (( ${#reports[@]} )) || { echo "::error::make test ran no integration tests"; exit 1; }
      # The reports carry what make test's quiet log leaves out.
      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/generated-sources/license/THIRD-PARTY.txt
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    # if: cannot read secrets, so the job carries only whether the key is set; the key itself
    # reaches the audit step alone, not make install's plugins and npm scripts or CodeQL.
    env:
      HAS_NVD_KEY: ${{ secrets.NVD_API_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-
      - name: Read pinned Node.js version
        id: node
        run: echo "version=$(sed -nE 's:.*<vaadin.node.version>(v[0-9.]+)</vaadin.node.version>.*:\1:p' pom.xml)" >> "$GITHUB_OUTPUT"
      - name: Cache Vaadin's Node.js
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.vaadin/node-${{ steps.node.outputs.version }}
          key: ${{ runner.os }}-vaadin-node-${{ steps.node.outputs.version }}
      - name: SAST (CodeQL)
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: java, javascript
      - name: Compile project
        run: make install
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      - name: Run OWASP Dependency-Check
        if: env.HAS_NVD_KEY == 'true'
        run: make audit
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - name: Upload Dependency-Check results
        if: ${{ !cancelled() && env.HAS_NVD_KEY == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html

  build:
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-
      - name: Read pinned Node.js version
        id: node
        run: echo "version=$(sed -nE 's:.*<vaadin.node.version>(v[0-9.]+)</vaadin.node.version>.*:\1:p' pom.xml)" >> "$GITHUB_OUTPUT"
      - name: Cache Vaadin's Node.js
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.vaadin/node-${{ steps.node.outputs.version }}
          key: ${{ runner.os }}-vaadin-node-${{ steps.node.outputs.version }}
      # make install builds without tests, then checks the pinned frontend dependencies;
      # MAVEN_ARGS adds the production frontend build to its Maven call, which runs devkit's
      # pinned Maven (its launcher reads MAVEN_ARGS).
      - name: Build with Maven
        run: make install
        env:
          MAVEN_ARGS: -Pproduction

  # GitHub's automatic dependency submission runs Maven on a bare checkout, where devkit's parent
  # POM does not resolve (Maven reads it only through the .devkit link), so it is off in the
  # repository settings and the dependency graph is submitted here, once the link exists.
  dependency-submission:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Cache Maven packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-
      - name: Link devkit
        run: ./devkitw path
      - uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6.0.1

