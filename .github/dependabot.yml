# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

multi-ecosystem-groups:
  infrastructure:
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "docker"
    directory: "/src/main/docker"
    patterns: ["eclipse-temurin:25.*.*"]
    multi-ecosystem-group: "infrastructure"

  - package-ecosystem: "maven"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "infrastructure"
    ignore:
      # Quarkus tracks the latest LTS line, NOT the latest stable release: LTS lines get
      # patch releases for far longer, which is what a project that ships releases needs.
      # 3.40.x is the current LTS, so anything >=3.41.0 is ignored even though newer stable
      # releases exist (scripts/version_check.py will still report them -- that output is
      # informational and expected, not a prompt to upgrade). Raise this bound only when a
      # new LTS line ships.
      - dependency-name: "io.quarkus:*"
        versions: [">=3.41.0"]
      - dependency-name: "io.quarkus.platform:*"
        versions: [">=3.41.0"]
      # The Jackson 3 security pin (pom.xml) must stay on 3.1.x: 3.2.x requires
      # com.fasterxml.jackson.core:jackson-annotations 2.22, but Quarkus manages 2.21, which
      # breaks Quarkus code generation (NoClassDefFoundError: JsonApplyView). Lift this once
      # Quarkus manages jackson-annotations >= 2.22, or drop it together with the pin.
      - dependency-name: "tools.jackson:jackson-bom"
        versions: [">=3.2.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "infrastructure"
