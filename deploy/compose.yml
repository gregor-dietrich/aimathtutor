  #   #   resources:
  #   #     reservations:
  #   #       devices:
  #   #         - driver: nvidia
  #   #           count: all
  #   #           capabilities: [gpu]
  #
  #   # Optional: Enable AMD GPU support (use with 0.40.13-rocm image)
  #   # Requires: AMD GPU (RX 6000/7000 series or newer) with ROCm drivers
  #   # devices:
  #   #   - /dev/kfd
  #   #   - /dev/dri
  #   # group_add:
  #   #   - video
  #
  #   healthcheck:
  #     test: ["CMD", "ollama", "ls"]
  #     interval: 10s
  #     timeout: 3s
  #     retries: 3
  #     start_period: 10s

volumes:
  aimathtutor_keys: # AES-256 master key — back this up; losing it = data unrecoverable
  aimathtutor_logs:
  # pgadmin_data: # Uncomment if you want to use pgAdmin
  # ollama_data: # Uncomment if you want to use Ollama
  postgres_data:
